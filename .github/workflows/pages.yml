# La démo live est sur Vercel : https://declic-livid.vercel.app
#
# GitHub Pages ne peut pas servir ce build Next tel quel :
# Cache Components / PPR est incompatible avec output: 'export'.
# Le workflow reste disponible en manuel si on repasse un jour en export
# statique (dans ce cas, le build écrit dans out/).
name: Publier la démo (manuel)
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Construire si nécessaire
        id: build
        run: |
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm ci && npm run build
            echo "dir=out" >> "$GITHUB_OUTPUT"
          else
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.dir }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
